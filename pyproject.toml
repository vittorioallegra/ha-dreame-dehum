[project]
name = "ha-dreame-dehum"
version = "0.1.6"
description = "Home Assistant integration for Dreame dehumidifiers"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S310", "S324"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components.dreame_dehum"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Home Assistant aliases voluptuous at runtime, but mypy sees the real types.
module = ["custom_components.dreame_dehum.config_flow", "dreame_dehum.config_flow"]
disable_error_code = ["arg-type"]
